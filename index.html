<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>잔광 — 카타나 로그</title><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}body{margin:0;background:#080d18;color:#e6f5ff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;left:18px;top:14px;pointer-events:none;font-size:13px;line-height:1.7;text-shadow:0 2px 4px #000}b{color:#64ffe1}#mode{color:#ffd177}#stick{position:fixed;bottom:32px;left:26px;width:124px;height:124px;border:1px solid #83d8ff55;border-radius:50%;background:#10243c88}#knob{position:absolute;left:40px;top:40px;width:42px;height:42px;border-radius:50%;background:#7beadd66;border:1px solid #8fffff}#attack{position:fixed;right:28px;bottom:42px;width:98px;height:98px;border-radius:50%;border:2px solid #6bffe0;background:#12394bdd;color:#c5fff4;font-weight:900;font-size:19px;box-shadow:0 0 25px #35e9ca22}#attack.aim{background:#774530dd;border-color:#ffd177;color:#ffe5b8}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050916bb;padding:24px;overflow:auto}.card{max-width:500px;width:100%;padding:28px;border:1px solid #315668;border-radius:18px;background:#0c1829;box-shadow:0 25px 90px #0008}h1{font-size:44px;letter-spacing:8px;margin:0;color:#87ffe1}h2{margin-top:0}p{font-size:14px;line-height:1.9;color:#afc5d8}.tag{font-size:11px;letter-spacing:3px;color:#75a3b7;margin-bottom:15px}button.option,#start{display:block;width:100%;padding:16px;margin-top:12px;background:#163347;border:1px solid #467585;color:white;border-radius:9px;font-size:15px;text-align:left;cursor:pointer}#start{background:#7aefd5;color:#0a2630;font-weight:800;text-align:center}.option small{display:block;color:#a4c5d5;margin-top:6px}#hint{position:fixed;top:18px;right:18px;font-size:11px;color:#91aabc;pointer-events:none}#pause{position:fixed;right:18px;top:48px;background:#10263b;border:1px solid #365369;color:#b9d5e5;border-radius:6px;padding:8px 12px} @media(max-width:500px){#hint{font-size:10px}.card{padding:22px}h1{font-size:36px}}</style><canvas id="c"></canvas><div id="hud"></div><div id="hint">WASD / 방향키 · Space 공격</div><button id="pause">Ⅱ</button><div id="stick"><div id="knob"></div></div><button id="attack">발도</button><div id="overlay"></div><script>
'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),atk=document.querySelector('#attack'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
const W=720,H=880,keys={},joy={x:0,y:0,id:null};let sw,sh,scale,ox,oy,last=0,state='menu',aim=false,angle=-Math.PI/2,player,enemies=[],bullets=[],particles=[],slashes=[],wave=0,kills=0,clock=0,shake=0,best=0,offered=[],paused=false;
try{best=Number(localStorage.getItem('katana-best')||0)}catch(e){}
function resize(){sw=innerWidth;sh=innerHeight;c.width=Math.round(sw*devicePixelRatio);c.height=Math.round(sh*devicePixelRatio);scale=Math.min(sw/W,sh/H);ox=(sw-W*scale)/2;oy=(sh-H*scale)/2}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function show(html){overlay.style.display='flex';overlay.innerHTML='<div class="card">'+html+'</div>'}function hide(){overlay.style.display='none'}
function menu(){show('<div class="tag">PIXEL ACTION / ROGUELITE PROTOTYPE</div><h1>잔광</h1><p>카타나 하나로 네온 격리 구역을 돌파하세요.</p><p><b>① 발도 버튼</b> — 시간이 12% 속도로 느려집니다.<br><b>② 조이스틱</b> — 돌진 각도를 정합니다.<br><b>③ 일섬 버튼</b> — 조준선 끝까지 베어 돌진합니다.</p><p>조준은 최대 3초. 돌진 중 무적이며 탄환을 벱니다.<br>적의 붉은 예고선을 피하세요. 웨이브마다 강화 1개 선택.<br>PC: WASD / 방향키로 이동·조준, Space로 발도.</p><button id="start">출격하기</button><p style="font-size:11px">최고 도달 웨이브 '+best+' · 절차적 웨이브 / 사망 시 강화 초기화</p>');document.querySelector('#start').onclick=start}
function start(){player={x:W/2,y:H*.57,hp:6,maxHp:6,speed:180,damage:2,range:250,cooldown:.72,cd:0,inv:0,dash:0,aimTime:0,dashStart:null,dashEnd:null,hit:new Set()};wave=0;kills=0;enemies=[];bullets=[];particles=[];slashes=[];aim=false;paused=false;state='play';hide();resetJoy();nextWave();syncButton()}
function nextWave(){wave++;bullets=[];for(let i=0;i<Math.min(4+wave*2,24);i++){let x,y;let tries=0;do{x=rand(55,W-55);y=rand(90,H-160);tries++}while(Math.hypot(x-player.x,y-player.y)<220&&tries<50);const types=['blade','pistol','spear','shotgun','heavy'];let type=types[Math.floor(rand(0,Math.min(types.length,2+Math.floor(wave/2))))];enemies.push({x,y,type,hp:type==='heavy'?5+Math.floor(wave/4):2+Math.floor((wave-1)/4),cd:rand(.7,2),wind:0,ang:0,flash:0})}}
function syncButton(){atk.textContent=aim?'일섬':player&&player.cd>0?'회수':'발도';atk.classList.toggle('aim',aim)}
function attack(){if(state!=='play'||paused||player.dash>0)return;if(aim){dash();return}if(player.cd>0)return;aim=true;player.aimTime=3;syncButton()}
function dash(){aim=false;player.dash=.14;player.inv=.30;player.cd=player.cooldown;player.dashStart={x:player.x,y:player.y};player.dashEnd={x:clamp(player.x+Math.cos(angle)*player.range,24,W-24),y:clamp(player.y+Math.sin(angle)*player.range,60,H-100)};player.hit=new Set();slashes.push({...player.dashStart,ex:player.dashEnd.x,ey:player.dashEnd.y,life:.32,max:.32});shake=7;syncButton()}
function segmentDistance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-160,160),vy:rand(-160,160),life:rand(.18,.5),color})}
function hurt(n){if(player.inv>0||player.dash>0)return;player.hp-=n;player.inv=.85;shake=10;burst(player.x,player.y,'#ff577c');if(player.hp<=0){state='dead';aim=false;best=Math.max(best,wave);try{localStorage.setItem('katana-best',best)}catch(e){}show('<div class="tag">RUN ENDED</div><h2>잔광이 사라졌다</h2><p>웨이브 '+wave+' 도달 · '+kills+'명 처치<br>최고 기록 '+best+' 웨이브</p><button id="start">새로운 도전</button>');document.querySelector('#start').onclick=start}}
const upgrades=[{name:'예리한 칼날',desc:'돌진 피해 +1',run:()=>player.damage++},{name:'뇌광 보법',desc:'돌진 거리 +45 (최대 430)',run:()=>player.range=Math.min(430,player.range+45)},{name:'납도 숙련',desc:'공격 재사용 시간 15% 감소 (최소 0.25초)',run:()=>player.cooldown=Math.max(.25,player.cooldown*.85)},{name:'회복약',desc:'체력 3 회복',run:()=>player.hp=Math.min(player.maxHp,player.hp+3)},{name:'강철 심장',desc:'최대 체력 +2, 체력 2 회복',run:()=>{player.maxHp+=2;player.hp=Math.min(player.maxHp,player.hp+2)}},{name:'가벼운 발걸음',desc:'이동 속도 +20 (최대 300)',run:()=>player.speed=Math.min(300,player.speed+20)}];
function reward(){state='upgrade';aim=false;resetJoy();offered=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);show('<div class="tag">SECTOR '+String(wave).padStart(2,'0')+' CLEAR</div><h2>다음 일섬을 준비하세요</h2><p>이번 도전에서 유지할 강화 하나를 선택하세요.</p>'+offered.map((u,i)=>'<button class="option" data-i="'+i+'">'+u.name+'<small>'+u.desc+'</small></button>').join(''));document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{offered[Number(b.dataset.i)].run();hide();state='play';nextWave()})}
function shoot(e,a,speed){bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:5})}
function enemyAttack(e){let a=e.ang,d=dist(e,player);if(e.type==='pistol')shoot(e,a,260);else if(e.type==='shotgun'){for(let j=-2;j<=2;j++)shoot(e,a+j*.17,220)}else{let reach=e.type==='spear'?155:e.type==='heavy'?110:72;let end={x:e.x+Math.cos(a)*reach,y:e.y+Math.sin(a)*reach};slashes.push({x:e.x,y:e.y,ex:end.x,ey:end.y,life:.2,max:.2,enemy:true});if(segmentDistance(player,e,end)<(e.type==='heavy'?36:24))hurt(e.type==='heavy'?2:1)}e.cd=e.type==='shotgun'?2.2:e.type==='heavy'?2:1.35}
function update(dt){clock+=dt;if(state!=='play'||paused)return;const world=dt*(aim?.12:1);player.cd=Math.max(0,player.cd-dt);player.inv=Math.max(0,player.inv-dt);let ix=joy.x,iy=joy.y;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;let mag=Math.hypot(ix,iy);if(mag>.12){angle=Math.atan2(iy,ix);if(mag>1){ix/=mag;iy/=mag}}
if(player.dash>0){const old={x:player.x,y:player.y};player.dash=Math.max(0,player.dash-dt);let t=1-player.dash/.14;player.x=player.dashStart.x+(player.dashEnd.x-player.dashStart.x)*t;player.y=player.dashStart.y+(player.dashEnd.y-player.dashStart.y)*t;for(const e of enemies){if(!player.hit.has(e)&&segmentDistance(e,old,player)<35){e.hp-=player.damage;e.flash=.18;player.hit.add(e);burst(e.x,e.y,'#70ffe0');if(e.hp<=0)kills++}}bullets=bullets.filter(b=>{if(segmentDistance(b,old,player)<40){burst(b.x,b.y,'#fbe29b',4);return false}return true})}else if(!aim){player.x=clamp(player.x+ix*player.speed*dt,24,W-24);player.y=clamp(player.y+iy*player.speed*dt,60,H-100)}
if(aim){player.aimTime-=dt;if(player.aimTime<=0)dash()}
for(const e of enemies){if(e.hp<=0)continue;e.flash=Math.max(0,e.flash-world);if(e.wind>0){e.wind-=world;if(e.wind<=0)enemyAttack(e);continue}e.cd-=world;let d=dist(e,player),a=Math.atan2(player.y-e.y,player.x-e.x),r=e.type==='pistol'?300:e.type==='shotgun'?245:e.type==='spear'?145:e.type==='heavy'?95:65;if(d>r*.85){let speed=e.type==='heavy'?45:e.type==='blade'?88:65;e.x+=Math.cos(a)*speed*world;e.y+=Math.sin(a)*speed*world}if(d<r+45&&e.cd<=0){e.wind=e.type==='heavy'?.9:.6;e.ang=a}}
for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){let a=enemies[i],b=enemies[j],d=dist(a,b);if(d>0&&d<27){let n=(27-d)*.5,dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;a.x+=dx*n;a.y+=dy*n;b.x-=dx*n;b.y-=dy*n}}
enemies=enemies.filter(e=>e.hp>0);for(const b of bullets){b.x+=b.vx*world;b.y+=b.vy*world;b.life-=world;if(dist(b,player)<16){hurt(1);b.life=0}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const s of slashes)s.life-=dt;slashes=slashes.filter(s=>s.life>0);shake=Math.max(0,shake-dt*35);syncButton();if(!enemies.length&&player.dash<=0&&state==='play')reward()}
function line(x,y,ex,ey,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke()}
function sprite(x,y,color,type,ang,flash){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.fillStyle='#0007';ctx.fillRect(-13,11,29,7);ctx.fillStyle=flash?'#fff':color;ctx.fillRect(-9,-7,18,20);ctx.fillStyle=flash?'#fff':'#25384e';ctx.fillRect(-8,13,6,9);ctx.fillRect(3,13,6,9);ctx.fillStyle='#d2c4c4';ctx.fillRect(-7,-19,14,12);ctx.fillStyle=type==='player'?'#1d263e':'#512f46';ctx.fillRect(-9,-21,18,7);ctx.fillStyle=type==='player'?'#73ffe0':'#ffbe79';ctx.fillRect(-7,-12,14,3);if(type==='player'){ctx.fillStyle='#69ead9';ctx.fillRect(-15,-6,7,5);ctx.fillRect(-22,-3,8,4)}ctx.rotate(ang);if(type==='pistol'||type==='shotgun'){ctx.fillStyle='#e6c4a1';ctx.fillRect(7,-3,type==='shotgun'?25:17,6);ctx.fillStyle='#343a50';ctx.fillRect(9,2,5,7)}else{ctx.fillStyle='#b8e8f1';ctx.fillRect(7,-2,type==='spear'?42:type==='heavy'?29:26,type==='heavy'?9:3);ctx.fillStyle='#ffd080';ctx.fillRect(9,-6,3,12)}ctx.restore()}
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle=aim?'#101a29':'#080d18';ctx.fillRect(0,0,sw,sh);ctx.save();ctx.translate(ox+(shake?rand(-shake,shake)*scale:0),oy+(shake?rand(-shake,shake)*scale:0));ctx.scale(scale,scale);ctx.fillStyle='#101b2b';ctx.fillRect(0,40,W,H-125);for(let x=0;x<W;x+=40)line(x,40,x,H-85,'#1b2a3b');for(let y=40;y<H-85;y+=40)line(0,y,W,y,'#1b2a3b');ctx.fillStyle='#21394b';ctx.fillRect(0,40,W,10);ctx.fillRect(0,H-94,W,9);for(let x=20;x<W;x+=100){ctx.fillStyle='#52d8ca';ctx.fillRect(x,43,40,3);ctx.fillStyle='#ad4d77';ctx.fillRect(x,H-91,40,3)}ctx.font='bold 66px monospace';ctx.fillStyle='#a2d5e008';ctx.fillText('AFTERIMAGE',35,440);for(const e of enemies){if(e.wind>0){let reach=['pistol','shotgun'].includes(e.type)?500:e.type==='spear'?155:e.type==='heavy'?110:72;line(e.x,e.y,e.x+Math.cos(e.ang)*reach,e.y+Math.sin(e.ang)*reach,'#ff5c6c99',e.type==='heavy'?22:3);if(e.type==='shotgun')for(const j of [-2,2])line(e.x,e.y,e.x+Math.cos(e.ang+j*.17)*reach,e.y+Math.sin(e.ang+j*.17)*reach,'#ff5c6c44',2)}sprite(e.x,e.y,{blade:'#ac5277',pistol:'#a98b52',spear:'#8064bc',shotgun:'#cd7652',heavy:'#788fa3'}[e.type],e.type,e.wind>0?e.ang:Math.atan2((player?.y||0)-e.y,(player?.x||0)-e.x),e.flash>0);ctx.fillStyle='#ff697c';ctx.fillRect(e.x-12,e.y-29,Math.min(36,e.hp*6),3)}for(const b of bullets){ctx.fillStyle='#ffd6a0';ctx.fillRect(b.x-3,b.y-3,6,6);line(b.x,b.y,b.x-b.vx*.035,b.y-b.vy*.035,'#ffb37688',3)}if(player){if(aim){let ex=clamp(player.x+Math.cos(angle)*player.range,24,W-24),ey=clamp(player.y+Math.sin(angle)*player.range,60,H-100);line(player.x,player.y,ex,ey,'#8cffe533',42);ctx.setLineDash([10,7]);line(player.x,player.y,ex,ey,'#9affeb',2);ctx.setLineDash([]);ctx.strokeStyle='#fff1b2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,13,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffd177';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,32,-Math.PI/2,-Math.PI/2+Math.PI*2*player.aimTime/3);ctx.stroke()}if(player.inv<=0||Math.floor(clock*24)%2===0||player.dash>0)sprite(player.x,player.y,'#338d99','player',angle,false)}for(const s of slashes){ctx.globalAlpha=s.life/s.max;line(s.x,s.y,s.ex,s.ey,s.enemy?'#ff577b':'#59ffde',s.enemy?10:25);line(s.x,s.y,s.ex,s.ey,'#fff',s.enemy?2:5)}ctx.globalAlpha=1;for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.restore();if(player){hud.innerHTML='<b>잔광</b> / WAVE '+String(wave).padStart(2,'0')+'<br>체력 '+Math.max(0,player.hp)+' / '+player.maxHp+'　적 '+enemies.length+'　처치 '+kills+'<br><span id="mode">'+(paused?'일시정지':aim?'시간 감속 · 방향 조준 '+player.aimTime.toFixed(1)+'초':player.cd>0?'납도 중 '+player.cd.toFixed(1)+'초':'발도 준비')+'</span>'}}
function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(frame)}
function resetJoy(){joy.x=joy.y=0;joy.id=null;knob.style.transform='translate(0px,0px)'}function moveJoy(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),n=Math.min(1,43/(d||1));joy.x=x*n/43;joy.y=y*n/43;knob.style.transform='translate('+x*n+'px,'+y*n+'px)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)moveJoy(e)});for(const name of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(name,e=>{if(e.pointerId===joy.id)resetJoy()});atk.addEventListener('pointerdown',e=>{e.preventDefault();attack()});addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat)attack();if(e.code==='Escape'&&!e.repeat)togglePause()});addEventListener('keyup',e=>keys[e.code]=false);function togglePause(){if(state!=='play')return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';resetJoy()}document.querySelector('#pause').onclick=togglePause;function blur(){Object.keys(keys).forEach(k=>delete keys[k]);resetJoy();if(state==='play'&&!paused)togglePause()}addEventListener('blur',blur);document.addEventListener('visibilitychange',()=>{if(document.hidden)blur()});menu();requestAnimationFrame(frame);
</script></html>
