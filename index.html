function drawImpact(s){const n=impactFrames.length,k=Math.min(n-1,Math.floor((1-s.life/s.max)*n)),img=impactFrames[k];if(!img.complete||!img.naturalWidth||!player)return;const sc=.85,w=img.width*sc,h=img.height*sc,a=Math.atan2(s.ey-s.y,s.ex-s.x);ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(Math.round(player.x),Math.round(player.y-4));ctx.rotate(a);ctx.scale(-1,1);ctx.drawImage(img,Math.round(-w*.5),Math.round(-h/2),Math.round(w),Math.round(h));ctx.restore()}

 if(aim||player.dash>0){if(Math.abs(Math.cos(angle))>.1)heroFacing=Math.cos(angle)>0?1:-1}else if(Math.abs(move)>.15)heroFacing=move>0?1:-1;
 let m=player.dash>0?'attack':aim?'aim':player.y<GROUND-24?(player.vy<0?'jump':'fall'):Math.abs(move)>.15?'run':'idle';
 if(m!==heroMotion){heroMotion=m;heroTime=0}tickDust(dt);heroTime+=dt;heroAttackTime=Math.max(0,heroAttackTime-dt);
}
function drawHero(x,y){
 const run=heroMotion==='run',air=heroMotion==='jump'||heroMotion==='fall',strike=player.dash>0||heroAttackTime>0;
 const S=.6,CX=112,FOOT=208,HIP=174,LEG=34,t=heroTime,N=heroFrames.length;
 const ok=i=>heroFrames[i]&&heroFrames[i].complete&&heroFrames[i].naturalWidth;
 const pick=i=>ok(i)?heroFrames[i]:heroFrames.find(m=>m.complete&&m.naturalWidth);
 ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(Math.round(x),Math.round(y+22));ctx.scale(heroFacing*S,S);
 if(run||air){
  const img=pick(0);if(!img){ctx.restore();return}
  const ph=t*15,L=[{sx:88,sw:30,px:103},{sx:118,sw:34,px:135}],pose=[];
  for(let i=0;i<2;i++){let th,sy;
   if(run){const p=ph+i*Math.PI;th=Math.sin(p)*.62;sy=1-.32*Math.max(0,Math.cos(p))}
   else if(heroMotion==='jump'){th=i?.5:-.75;sy=i?.92:.62}else{th=i?.25:-.3;sy=1}
   pose.push({th,sy,foot:LEG*sy*Math.cos(th)})}
  const shift=run?LEG-Math.max(pose[0].foot,pose[1].foot):0;
  const lean=run?.07:air?(player.vy<0?-.06:.06):0;
  for(let i=0;i<2;i++){ctx.save();ctx.translate(L[i].px-CX,-LEG+shift);ctx.rotate(pose[i].th);ctx.scale(1,pose[i].sy);
   ctx.drawImage(img,L[i].sx,HIP-2,L[i].sw,FOOT-HIP+2,L[i].sx-L[i].px,-2,L[i].sw,FOOT-HIP+2);ctx.restore()}
  ctx.translate(0,shift);ctx.translate(0,-LEG);ctx.rotate(lean);ctx.translate(0,LEG);
  ctx.drawImage(img,0,0,240,HIP,-CX,-FOOT,240,HIP);
 }else{
  let f=strike?Math.min(N-1,34+Math.floor((.22-heroAttackTime)/.22*(N-34))):aim?0:Math.floor(t*12)%34;
  if(strike){for(let j=3;j>0;j--){ctx.globalAlpha=.12*(4-j);ctx.drawImage(pick(f),-CX-j*34,-FOOT,240,240)}ctx.globalAlpha=1}
  ctx.drawImage(pick(f),-CX,-FOOT,240,240);
  if(strike){ctx.strokeStyle='#c7ff96';ctx.lineWidth=5;ctx.beginPath();ctx.arc(10,-90,70,-1.8,.9);ctx.stroke()}
 }
 ctx.restore();
}

function sprite(x,y,color,type,ang,flash){if(type==='player'){if(!slashes.some(f=>f.fx))drawHero(x,y);return;}ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.fillStyle='#0007';ctx.fillRect(-13,11,29,7);ctx.fillStyle=flash?'#fff':color;ctx.fillRect(-9,-7,18,20);ctx.fillStyle=flash?'#fff':'#25384e';ctx.fillRect(-8,13,6,9);ctx.fillRect(3,13,6,9);ctx.fillStyle='#d2c4c4';ctx.fillRect(-7,-19,14,12);ctx.fillStyle=type==='player'?'#1d263e':'#512f46';ctx.fillRect(-9,-21,18,7);ctx.fillStyle=type==='player'?'#73ffe0':'#ffbe79';ctx.fillRect(-7,-12,14,3);if(type==='player'){ctx.fillStyle='#69ead9';ctx.fillRect(-15,-6,7,5);ctx.fillRect(-22,-3,8,4)}ctx.rotate(ang);if(type==='pistol'||type==='shotgun'){ctx.fillStyle='#e6c4a1';ctx.fillRect(7,-3,type==='shotgun'?25:17,6);ctx.fillStyle='#343a50';ctx.fillRect(9,2,5,7)}else{ctx.fillStyle='#b8e8f1';ctx.fillRect(7,-2,type==='spear'?42:type==='heavy'?29:26,type==='heavy'?9:3);ctx.fillStyle='#ffd080';ctx.fillRect(9,-6,3,12)}ctx.restore()}
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#060b14';ctx.fillRect(0,0,sw,sh);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();ctx.save();ctx.translate(-camera+(shake?rand(-shake,shake):0),shake?rand(-shake,shake):0);drawBuilding();
for(const e of enemies){if(e.x<camera-550||e.x>camera+W+550)continue;if(e.wind>0){let reach=['pistol','shotgun'].includes(e.type)?500:e.type==='spear'?155:e.type==='heavy'?110:72;line(e.x,e.y,e.x+Math.cos(e.ang)*reach,e.y+Math.sin(e.ang)*reach,'#ff5c6c88',e.type==='heavy'?16:2);if(e.type==='shotgun')for(const j of [-2,2])line(e.x,e.y,e.x+Math.cos(e.ang+j*.17)*reach,e.y+Math.sin(e.ang+j*.17)*reach,'#ff5c6c44',2)}sprite(e.x,e.y,{blade:'#ac5277',pistol:'#a98b52',spear:'#8064bc',shotgun:'#cd7652',heavy:'#788fa3'}[e.type],e.type,e.wind>0?e.ang:player&&player.x<e.x?Math.PI:0,e.flash>0);ctx.fillStyle='#ff697c';ctx.fillRect(e.x-16,e.y-32,32*Math.max(0,e.hp/e.maxHp),3)}
for(const b of bullets){ctx.fillStyle='#ffd6a0';ctx.fillRect(b.x-3,b.y-3,6,6);line(b.x,b.y,b.x-b.vx*.035,b.y-b.vy*.035,'#ffb37688',3)}if(player){if(aim){let ex=clamp(player.x+Math.cos(angle)*player.range,24,LEVEL-28),ey=clamp(player.y+Math.sin(angle)*player.range,110,GROUND-22);line(player.x,player.y,ex,ey,'#9affeb',2);ctx.strokeStyle='#ffd177';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,31,-Math.PI/2,-Math.PI/2+Math.PI*2*player.aimTime/3);ctx.stroke()}ctx.globalAlpha=player.inv>0&&Math.floor(clock*24)%2===0&&player.dash<=0?.65:1;drawDust();sprite(player.x,player.y,'#338d99','player',angle,false);ctx.globalAlpha=1}for(const s of slashes){if(s.fx){drawImpact(s);continue}ctx.globalAlpha=s.life/s.max;line(s.x,s.y,s.ex,s.ey,s.enemy?'#ff577b':'#59ffde',s.enemy?10:25);line(s.x,s.y,s.ex,s.ey,'#fff',s.enemy?2:5)}ctx.globalAlpha=1;for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.restore();
// World overview is always visible, including enemies behind the camera.
if(player){let mw=Math.min(W-40,500),mx=(W-mw)/2,my=110;ctx.fillStyle='#081422dd';ctx.fillRect(mx-8,my-18,mw+16,37);ctx.fillStyle='#38526a';ctx.fillRect(mx,my,mw,3);for(const e of enemies){ctx.fillStyle='#ff6a88';ctx.fillRect(mx+e.x/LEVEL*mw-2,my-3,4,8)}ctx.fillStyle='#76ffe2';ctx.fillRect(mx+player.x/LEVEL*mw-3,my-5,6,12);ctx.fillStyle=floorCleared?'#76ffe2':'#697b91';ctx.fillRect(mx+lift.x/LEVEL*mw-3,my-4,6,10);ctx.font='10px sans-serif';ctx.fillStyle='#9bb5c7';ctx.textAlign='center';ctx.fillText('입구 ── 층 전체 지도 / 붉은 점: 적 ── 엘리베이터',W/2,my-7);ctx.textAlign='start';if(floorCleared){ctx.font='bold 14px sans-serif';ctx.fillStyle='#86ffe3';ctx.textAlign='center';ctx.fillText('층 확보 · 오른쪽 끝 엘리베이터로 이동 →',W/2,155);ctx.textAlign='start'}}ctx.restore();if(state==='lift')drawLiftTransit();if(player){hud.innerHTML='<b>잔광 · 횡스크롤 침투</b> / '+floorNo()+'F · '+wave+'/30<br>체력 '+Math.max(0,player.hp)+' / '+player.maxHp+'　남은 적 '+enemies.length+'　처치 '+kills+'<br><span id="mode">'+(paused?'일시정지':state==='lift'?'엘리베이터 하강 중':floorCleared?(nearLift()?(floorNo()===1?'탈출 버튼을 누르세요':'탑승 버튼을 누르세요'):'오른쪽 끝 엘리베이터로 →'):nearLift()?'잠금 · 남은 적을 모두 처치하세요':aim?'시간 감속 · 조준 '+player.aimTime.toFixed(1)+'초':player.cd>0?'납도 중 '+player.cd.toFixed(1)+'초':'발도 준비 · 쿨타임 0초')+'</span>'}}

function win(){state='win';resetJoy();show('<div class="tag">MISSION COMPLETE / 01F</div><h1>탈출 성공</h1><p>30층의 경계를 뚫고 도시로 돌아왔습니다.<br>총 '+kills+'명 처치 · 모든 층 확보</p><button id="start">다시 침투하기</button><button class="back" id="toMenu">메인 메뉴</button>');document.querySelector('#start').onclick=start;document.querySelector('#toMenu').onclick=menu}
function drawBuilding(){ctx.fillStyle=aim?'#13202d':'#101927';ctx.fillRect(0,70,LEVEL,GROUND-70);ctx.fillStyle='#263346';ctx.fillRect(0,165,LEVEL,10);ctx.fillRect(0,GROUND,LEVEL,16);ctx.fillStyle='#080f1c';ctx.fillRect(0,GROUND+16,LEVEL,H-GROUND);for(let x=0;x<LEVEL;x+=240){if(x<camera-250||x>camera+W+250)continue;ctx.fillStyle='#354457';ctx.fillRect(x,175,9,GROUND-175);ctx.fillStyle='#081222';ctx.fillRect(x+20,192,198,150);for(let i=0;i<6;i++){let bx=x+24+i*32,bh=40+((i*37+x/4)%90);ctx.fillStyle=['#15243b','#1d2a43','#1b3045'][i%3];ctx.fillRect(bx,342-bh,27,bh);for(let j=0;j<5;j++){ctx.fillStyle=(i+j)%3===0?'#a98b59':'#326175';ctx.fillRect(bx+5,344-bh+j*16,4,3);ctx.fillRect(bx+16,344-bh+j*16,4,3)}}ctx.fillStyle='#344b62';ctx.fillRect(x+20,340,198,5);ctx.fillRect(x+115,192,4,150);ctx.fillStyle='#84d8d9';ctx.fillRect(x+70,176,100,3);ctx.fillStyle='#33425b';ctx.fillRect(x+55,362,110,6);ctx.fillRect(x+65,368,5,34);ctx.fillRect(x+150,368,5,34);ctx.fillStyle='#142335';ctx.fillRect(x+90,346,36,17);ctx.fillStyle='#55bfb7';ctx.fillRect(x+94,350,28,8);ctx.font='12px monospace';ctx.fillStyle='#65778c';ctx.fillText(String(floorNo()).padStart(2,'0')+'F / '+String(x/240+1).padStart(2,'0'),x+65,327)}
ctx.fillStyle='#101e2c';ctx.fillRect(15,270,100,132);ctx.fillStyle='#42627d';ctx.fillRect(26,280,78,122);ctx.font='12px monospace';ctx.fillStyle='#c2d4e1';ctx.fillText('ENTRY',45,309);
let lx=lift.x;ctx.fillStyle='#0a1321';ctx.fillRect(lx-72,256,144,146);ctx.fillStyle='#355368';ctx.fillRect(lx-77,252,154,7);ctx.fillStyle=floorCleared?'#79ffe0':'#ff7a91';ctx.fillRect(lx-62,264,124,4);ctx.fillStyle='#2b3f53';if(floorCleared){ctx.fillRect(lx-65,272,12,130);ctx.fillRect(lx+53,272,12,130);ctx.fillStyle='#1a454b';ctx.fillRect(lx-52,272,104,130);ctx.fillStyle='#84ffdc33';ctx.fillRect(lx-75,402,150,15)}else{ctx.fillRect(lx-65,272,63,130);ctx.fillRect(lx+2,272,63,130)}ctx.textAlign='center';ctx.font='bold 15px monospace';ctx.fillStyle=floorCleared?'#89ffdf':'#ff96a7';ctx.fillText(floorNo()+'F '+(floorCleared?'▼ OPEN':'LOCKED'),lx,242);ctx.font='12px sans-serif';ctx.fillText(floorCleared?(floorNo()===1?'탈출':'탑승'):'적 '+enemies.length+'명 남음',lx,322);ctx.textAlign='start';
}

function drawLiftTransit(){ctx.save();ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#050c16f2';ctx.fillRect(0,0,sw,sh);let t=clamp(liftTime/2.4,0,1);let bw=Math.min(sw*.7,340),bh=Math.min(sh*.48,360),x=(sw-bw)/2,y=(sh-bh)/2;ctx.fillStyle='#24394a';ctx.fillRect(x-7,y-7,bw+14,bh+14);ctx.fillStyle='#111e2d';ctx.fillRect(x,y,bw,bh);let opening=t<.23?1-t/.23:t>.82?(t-.82)/.18:0;ctx.fillStyle='#2a4052';ctx.fillRect(x,y,bw/2*(1-opening),bh);ctx.fillRect(x+bw/2+bw/2*opening,y,bw/2*(1-opening),bh);ctx.fillStyle='#70ffe0';ctx.textAlign='center';ctx.font='bold 34px monospace';ctx.fillText((t<.55?floorNo():floorNo()-1)+'F ▼',sw/2,y-35);ctx.font='14px sans-serif';ctx.fillText(floorNo()+'층 → '+(floorNo()-1)+'층 · 하강 중',sw/2,y+bh+38);ctx.fillStyle='#224353';ctx.fillRect(x,y+bh+58,bw,3);ctx.fillStyle='#70ffe0';ctx.fillRect(x,y+bh+58,bw*t,3);ctx.restore()}

function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(frame)}
function resetJoy(){joy.x=joy.y=0;joy.id=null;knob.style.transform='translate(0px,0px)'}function moveJoy(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),n=Math.min(1,43/(d||1));joy.x=x*n/43;joy.y=y*n/43;knob.style.transform='translate('+x*n+'px,'+y*n+'px)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)moveJoy(e)});for(const name of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(name,e=>{if(e.pointerId===joy.id)resetJoy()});document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});atk.addEventListener('pointerdown',e=>{e.preventDefault();attack()});addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat)attack();if(['KeyW','ArrowUp','KeyJ'].includes(e.code)&&!e.repeat)jump();if(e.code==='Escape'&&!e.repeat)togglePause()});addEventListener('keyup',e=>keys[e.code]=false);function togglePause(){if(state!=='play'&&state!=='lift')return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';resetJoy()}document.querySelector('#pause').onclick=togglePause;function blur(){Object.keys(keys).forEach(k=>delete keys[k]);resetJoy();if((state==='play'||state==='lift')&&!paused)togglePause()}addEventListener('blur',blur);document.addEventListener('visibilitychange',()=>{if(document.hidden)blur()});menu();requestAnimationFrame(frame);
</script></html>
